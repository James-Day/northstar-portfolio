name: Checks

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run baseline:gate
      - run: npm run test:security
      - run: npm run test:e2e:install
      - run: npm run test:e2e
