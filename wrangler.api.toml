name = "northstar-portfolio-api"
main = "workers/api.ts"
compatibility_date = "2026-05-22"
compatibility_flags = ["nodejs_compat"]

[vars]
APP_ENV = "development"
MARKETSTACK_MONTHLY_CAP = "100"

[triggers]
# Run hourly on weekdays; the application guard selects the first eligible
# after-close run in New York time and skips weekends/holidays.
crons = ["0 * * * 1-5"]

# Configure SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, and MARKETSTACK_API_KEY as
# Worker secrets for deployed environments. Never put production secrets here.
