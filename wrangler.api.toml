name = "northstar-portfolio-api"
main = "workers/api.ts"
compatibility_date = "2026-05-22"
compatibility_flags = ["nodejs_compat"]

[vars]
APP_ENV = "development"
MARKETSTACK_MONTHLY_CAP = "100"
# Optional comma-separated YYYY-MM-DD overrides for extraordinary exchange sessions.
# Keep these in deployment configuration; do not change source code for one-off closures.
MARKET_CALENDAR_CLOSED_DATES = ""
MARKET_CALENDAR_OPEN_DATES = ""
# Required before enabling the report queue consumer; set by the price
# publication scheduler after a close is available.
REPORT_THROUGH_DATE = ""
REPORT_MAX_LOOKBACK_DAYS = "1830"

[triggers]
# Run hourly on weekdays; the application guard selects the first eligible
# after-close run in New York time and skips weekends/holidays.
crons = ["0 * * * 1-5"]

[[durable_objects.bindings]]
name = "RATE_LIMIT_COUNTER"
class_name = "RateLimitCounterDurableObject"

[[durable_objects.bindings]]
name = "REFRESH_CLAIM"
class_name = "RefreshClaimDurableObject"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RateLimitCounterDurableObject", "RefreshClaimDurableObject"]

# Durable work queues are declared up front so imports and report publication
# can move out of request time without changing the public API contract.
[[queues.producers]]
binding = "IMPORT_QUEUE"
queue = "northstar-imports"

[[queues.producers]]
binding = "REPORT_QUEUE"
queue = "northstar-reports"

[[queues.producers]]
binding = "PRICE_QUEUE"
queue = "northstar-prices"

[[queues.consumers]]
queue = "northstar-imports"
max_batch_size = 10
max_batch_timeout = 30
max_retries = 5
dead_letter_queue = "northstar-imports-dlq"

[[queues.consumers]]
queue = "northstar-reports"
max_batch_size = 10
max_batch_timeout = 30
max_retries = 5
dead_letter_queue = "northstar-reports-dlq"

[[queues.consumers]]
queue = "northstar-prices"
max_batch_size = 25
max_batch_timeout = 30
max_retries = 5
dead_letter_queue = "northstar-prices-dlq"

# Configure SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, and MARKETSTACK_API_KEY as
# Worker secrets for deployed environments. Never put production secrets here.
